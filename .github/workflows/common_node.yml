name: Common Node Workflow

on:
    workflow_call:
        inputs:
            node-version:
                required: true
                type: string
        secrets:
            NPM_TOKEN:
                required: true


jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
            repo-token: ${{ secrets.GITHUB_TOKEN }}
            node-version: ${{ inputs.node-version }}
            cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Biome Check
        run: npm run check

  test:
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run test
        run: npm run test

  build:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
            repo-token: ${{ secrets.GITHUB_TOKEN }}
            node-version: ${{ inputs.node-version }}
            cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build Project
        run: npm run build

