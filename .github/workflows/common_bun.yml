name: Common Bun Workflow

on:
  workflow_call:
    inputs:
      bun-version:
        description: "Bun version used by the workflow"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install Dependencies
        run: bun install
      - name: Check Project
        run: bun run check
      - name: Check lint
        run: bun run lint

  #  test:
  #    runs-on: ubuntu-latest
