  #    steps:
  #      - uses: actions/checkout@v4
  #      - uses: actions/setup-node@v4
  #        with:
  #          node-version: ${{ inputs.node-version }}
  #          cache: npm
  #      - name: Install Dependencies
  #        run: npm ci
  #      - name: Run test
  #        run: npm run test

  build:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install Dependencies
        run: bun install
      - name: Build Project
        run: bun run build
